services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /work
    command: sleep infinity
    volumes:
      - ..:/work
      - gomod:/go/pkg/mod
      - gocache:/home/dev/.cache/go-build
    environment:
      - MYBENCH_TEST_DSN=root:devroot@tcp(db:3306)/mybench_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: mybench_test
    # host-loopback publish so the desktop binary on the host can test against
    # it; the dev container still reaches it as db:3306. When another project
    # holds 3306, set MYBENCH_DB_PORT in .devcontainer/.env (untracked).
    ports:
      - "127.0.0.1:${MYBENCH_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdevroot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Second server so multi-connection (global tabs, connID keying) is testable
  db2:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: mybench_other
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdevroot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gomod:
  gocache:

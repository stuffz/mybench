version: '3'

vars:
  APP_NAME: "mybench"
  BIN_DIR: "bin"

# The halves live next to their code and stay runnable standalone from their
# own directories — each task pins its dir itself (TASKFILE_DIR-relative).
# Namespacing gives the same task names as before the split
# (gui:build:windows, backend:test…).
includes:
  backend: backend/Taskfile.yml
  gui: gui/Taskfile.yml

tasks:
  default:
    cmds:
      # Not a literal `task`: distros ship the binary as go-task (taskwarrior
      # owns the name), so refer to whatever executable is actually running.
      - "{{.TASK_EXE}} --list"
    silent: true

  # ── One entry point per verb ──────────────────────────────────────────
  # The bare verb fans out to every half that implements it; the namespaced
  # backend:*/gui:* tasks stay callable on their own.
  check:
    desc: Full gate — tests, lint and format check, both halves
    cmds:
      - task: test
      - task: lint
      - task: format-check

  test:
    desc: All tests — go test (backend), ctest over the QTest suite (gui)
    cmds:
      - task: backend:test
      - task: gui:test

  lint:
    desc: Lint everything — golangci-lint (backend), clang-tidy + standalone headers (gui)
    cmds:
      - task: backend:lint
      - task: gui:lint

  format:
    desc: Rewrite all sources — gofumpt (backend), clang-format (gui)
    cmds:
      - task: backend:format
      - task: gui:format

  format-check:
    desc: Verify formatting everywhere (CI gate)
    cmds:
      - task: backend:format-check
      - task: gui:format-check

  tidy:
    desc: go mod tidy (backend — the GUI has no manifest to tidy)
    cmds:
      - task: backend:tidy

  clean:
    desc: Remove build artifacts (bin/, gui/build, gui/build-rel)
    cmds:
      - rm -rf {{.BIN_DIR}} gui/build gui/build-rel

  db:test:
    desc: Start a seeded MySQL 8.4 test server on 127.0.0.1:3307 (root/devroot) — task db:test PORT=4000
    cmds:
      # Standalone rather than the devcontainer compose service: that project is
      # owned by the Dev Containers tooling, which stops it out from under you.
      # Named volume, so the seed survives a restart.
      # Default port 3307, not 3306: the devcontainer's db publishes
      # 127.0.0.1:3306 and the two would collide.
      - docker volume create mybench-testdb-data
      - docker rm -f mybench-testdb 2>/dev/null || true
      - docker run -d --name mybench-testdb --restart unless-stopped
        -e MYSQL_ROOT_PASSWORD=devroot -e MYSQL_DATABASE=mybench_test
        -p 127.0.0.1:{{.PORT | default 3307}}:3306 -v mybench-testdb-data:/var/lib/mysql
        --health-cmd='mysqladmin ping -h 127.0.0.1 -uroot -pdevroot'
        --health-interval=5s --health-timeout=3s --health-retries=30 mysql:8.4
      - task: db:seed

  db:seed:
    desc: (Re)apply .devcontainer/seed.sql to the test server — drops and recreates
    cmds:
      # mysqladmin ping, not `docker inspect -f {{...}}`: task claims Go-template
      # braces before the shell sees them, which silently emptied the old check
      # and spun this loop forever. This also works on a container with no
      # healthcheck, and is bounded so a server that never comes up fails loudly.
      - |
        n=0
        until docker exec mybench-testdb mysqladmin ping -h127.0.0.1 -uroot -pdevroot --silent 2>/dev/null; do
          n=$((n+1))
          [ "$n" -gt 40 ] && { echo "mybench-testdb not ready after 2m" >&2; exit 1; }
          sleep 3
        done
      - docker exec -i mybench-testdb mysql -uroot -pdevroot < .devcontainer/seed.sql

  db:seed:big:
    desc: Append bulk rows to the test server (defaults 100 customers, 1M orders — task db:seed:big ORDERS=50000 PORT=4000)
    cmds:
      - docker run --rm --network host -v "$PWD":/work -v devcontainer_gomod:/go/pkg/mod
        -w /work/backend -e CGO_ENABLED=0 golang:trixie
        go run ./cmd/mybench-seed -customers {{.CUSTOMERS | default 100}} -orders {{.ORDERS | default 1000000}}
        -dsn 'root:devroot@tcp(127.0.0.1:{{.PORT | default 3307}})/shop'
